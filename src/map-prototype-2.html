<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TLH Map Prototype v2 - Building Isometric Layout</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Patrick+Hand&display=swap");

      :root {
        --bg: #0b0b0b;
        --panel: #151515;
        --panel-line: #4a4a4a;
        --ink: #e2e2e2;
        --muted: #9b9b9b;
        --mass: #161616;
        --floor-inactive: #262626;
        --floor-active: #444444;
        --line-primary: #e2e2e2;
        --line-secondary: #7a7a7a;
        --line-hidden: #4a4a4a;
        --danger: #6e1f1f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: radial-gradient(circle at 18% 8%, #1a1a1a 0%, var(--bg) 58%);
        color: var(--ink);
        min-height: 100vh;
      }

      .page {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 12px;
        display: flex;
        flex-direction: column;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
      }

      p {
        margin: 0 0 12px;
        color: var(--muted);
      }

      .controls {
        display: flex;
        flex-wrap: nowrap;
        gap: 16px;
        margin-bottom: 14px;
        color: var(--muted);
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        scrollbar-width: thin;
      }

      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .frame {
        border: 1px solid var(--panel-line);
        background: linear-gradient(180deg, #111111 0%, #0d0d0d 100%);
        overflow: hidden;
        flex: 1;
        min-height: 0;
        position: relative;
      }

      svg {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        user-select: none;
        position: relative;
        z-index: 1;
      }

      .snow-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        pointer-events: none;
        mix-blend-mode: screen;
      }

      svg.dragging {
        cursor: grabbing;
      }

      .layer {
        fill: #191611;
        stroke: var(--panel-line);
        stroke-width: 1;
      }

      .layer-title {
        fill: var(--muted);
        font-size: 36px;
        text-anchor: middle;
      }

      .room {
        fill: var(--room-fill);
        stroke: var(--room-line);
        stroke-width: 1.3;
      }

      .room-section-b {
        stroke: #8fb9cf;
      }

      .room-section-c {
        stroke: #c6aa78;
      }

      .room-label {
        fill: var(--ink);
        font-size: 28px;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .room-label-id {
        fill: var(--muted);
        font-size: 22px;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .legend-item-label {
        fill: var(--muted);
        font-size: 44px;
        font-family: "IM Fell English SC", Georgia, "Times New Roman", serif;
        letter-spacing: 0.35px;
        text-anchor: start;
        dominant-baseline: central;
      }

      .legend-building-icon-frame {
        fill: rgba(24, 25, 27, 0.86);
        stroke: rgba(232, 236, 240, 0.78);
        stroke-width: 1.6;
      }

      .legend-building-icon {
        opacity: 1;
        filter: brightness(1.45) contrast(1.22);
        pointer-events: none;
      }

      .legend-building-label {
        fill: rgba(238, 240, 244, 0.94);
        font-size: 38px;
        font-family: "IM Fell English SC", Georgia, "Times New Roman", serif;
        text-anchor: start;
        dominant-baseline: central;
      }

      .map-fit-ignore {
        pointer-events: none;
      }

      .grid-meta-label {
        fill: var(--muted);
        font-size: 44px;
        font-family: "IM Fell English SC", Georgia, "Times New Roman", serif;
        letter-spacing: 0.35px;
        text-anchor: start;
        dominant-baseline: central;
      }

      .building-frame {
        fill: rgba(22, 22, 22, 0.5);
        stroke: rgba(122, 122, 122, 0.55);
        stroke-width: 1.4;
        stroke-dasharray: 8 6;
        rx: 14;
      }

      .building-layer-band {
        fill: rgba(20, 18, 13, 0.48);
        stroke: rgba(120, 110, 88, 0.32);
        stroke-width: 1;
      }

      .building-frame-main {
        stroke: rgba(198, 170, 120, 0.8);
      }

      .building-frame-campus {
        stroke: rgba(143, 185, 207, 0.8);
      }

      .building-frame-underground {
        stroke: rgba(169, 154, 207, 0.8);
      }

      .section-title {
        fill: var(--line-primary);
        font-size: 32px;
        font-weight: 700;
      }

      .legend-title {
        fill: var(--line-primary);
        font-size: 56px;
        font-weight: 700;
        font-family: "IM Fell English SC", Georgia, "Times New Roman", serif;
        letter-spacing: 0.45px;
      }

      .campus-road {
        fill: rgba(38, 38, 38, 0.5);
        stroke: rgba(122, 122, 122, 0.65);
        stroke-width: 1.6;
      }

      .campus-road-base {
        fill: rgba(8, 10, 13, 0.97);
      }

      .campus-road-grain {
        fill: rgba(192, 202, 214, 0.016);
        filter: url(#road-grain-filter);
      }

      .campus-road-photo-texture {
        opacity: 0.62;
        filter: contrast(1.22) brightness(0.92);
        pointer-events: none;
      }

      .campus-road-scratch-line {
        stroke: rgba(202, 210, 220, 0.09);
        stroke-width: 0.9;
        stroke-linecap: round;
      }

      .campus-road-edge-halo {
        stroke: rgba(222, 228, 236, 0.2);
        stroke-width: 5.2;
        fill: none;
        stroke-linecap: round;
      }

      .campus-road-edge-primary {
        stroke: rgba(214, 216, 220, 0.9);
        stroke-width: 2.35;
        fill: none;
        stroke-linecap: round;
      }

      .campus-road-edge-secondary {
        stroke: rgba(158, 164, 170, 0.66);
        stroke-width: 1.28;
        fill: none;
        stroke-linecap: round;
      }

      .campus-road-centerline {
        stroke: rgba(210, 216, 224, 0.8);
        stroke-width: 1.45;
        fill: none;
        stroke-linecap: round;
      }

      .campus-road-centerline-ghost {
        stroke: rgba(190, 198, 206, 0.34);
        stroke-width: 2.6;
        fill: none;
        stroke-linecap: round;
      }

      .campus-road-junction {
        fill: rgba(8, 10, 13, 0.94);
      }

      .campus-road-junction-grain {
        fill: rgba(192, 202, 214, 0.05);
        filter: url(#road-grain-filter);
      }

      .brown-outline-main {
        fill: none;
        stroke: rgba(228, 232, 236, 0.86);
        stroke-width: 2.1;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .brown-outline-sub {
        fill: none;
        stroke: rgba(170, 178, 186, 0.68);
        stroke-width: 1.15;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .campus-building {
        fill: rgba(22, 22, 22, 0.9);
        stroke: rgba(226, 226, 226, 0.78);
        stroke-width: 2.5;
        rx: 16;
      }

      .campus-building-outline-overlay {
        fill: none;
        stroke: rgba(230, 234, 238, 0.8);
        stroke-width: 2.2;
        pointer-events: none;
      }

      .campus-central {
        fill: rgba(26, 26, 26, 0.94);
      }

      .campus-accent {
        stroke: rgba(226, 226, 226, 0.92);
      }

      .campus-label {
        fill: var(--line-primary);
        font-size: 48px;
        font-weight: 700;
        text-anchor: middle;
      }

      .campus-sub {
        fill: #adadad;
        font-size: 26px;
        text-anchor: middle;
      }

      .campus-label-side {
        fill: var(--line-primary);
        font-size: 38px;
        font-weight: 700;
        font-family: "IM Fell English SC", Georgia, "Times New Roman", serif;
        letter-spacing: 0.4px;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .campus-sub-side {
        fill: #adadad;
        font-size: 22px;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .campus-label-bottom {
        fill: var(--line-primary);
        font-size: 46px;
        font-weight: 700;
        font-family: "IM Fell English SC", Georgia, "Times New Roman", serif;
        letter-spacing: 0.5px;
        text-anchor: start;
        dominant-baseline: hanging;
      }

      .campus-sub-inside {
        fill: #b5b5b5;
        font-size: 24px;
        text-anchor: start;
        dominant-baseline: central;
      }

      .tile-grid-line {
        stroke: rgba(150, 140, 120, 0.2);
        stroke-width: 1;
      }

      .tile-grid-major {
        stroke: rgba(187, 172, 138, 0.3);
        stroke-width: 1.2;
      }

      .tile-grid-point {
        fill: rgba(206, 191, 156, 0.42);
      }

      .tile-grid-cell {
        fill: rgba(38, 38, 38, 0.16);
        stroke: rgba(122, 122, 122, 0.45);
        stroke-width: 1;
      }

      .tile-room-known {
        fill: transparent;
        stroke: none;
        stroke-width: 0;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .tile-room-focus {
        fill: rgba(42, 42, 42, 0.9);
        stroke: rgba(232, 236, 240, 0.98);
        stroke-width: 3.5;
        opacity: 1;
      }

      .tile-room-above {
        fill: rgba(34, 34, 34, 0.86);
        stroke: rgba(206, 210, 214, 0.84);
        stroke-width: 2.2;
        opacity: 0.8;
      }

      .tile-room-below {
        fill: rgba(18, 18, 18, 0.88);
        stroke: rgba(170, 176, 182, 0.72);
        stroke-width: 2;
        opacity: 0.58;
      }

      .tile-room-shadow {
        stroke: none;
        pointer-events: none;
      }

      .tile-room-shadow-focus {
        fill: rgba(0, 0, 0, 0.3);
      }

      .tile-room-shadow-above {
        fill: rgba(0, 0, 0, 0.24);
      }

      .tile-room-shadow-below {
        fill: rgba(0, 0, 0, 0.18);
      }

      .tile-room-rim {
        stroke-width: 0.7;
        pointer-events: none;
      }

      .tile-room-rim-focus {
        fill: rgba(36, 42, 48, 0.84);
        stroke: rgba(182, 188, 194, 0.56);
      }

      .tile-room-rim-above {
        fill: rgba(30, 34, 32, 0.78);
        stroke: rgba(166, 172, 178, 0.48);
      }

      .tile-room-rim-below {
        fill: rgba(28, 30, 32, 0.76);
        stroke: rgba(148, 154, 160, 0.46);
      }

      .tile-room-hatch {
        stroke: none;
        pointer-events: none;
      }

      .tile-room-hatch-focus {
        fill: url(#tile-hatch-focus);
        opacity: 0.36;
      }

      .tile-room-hatch-above {
        fill: url(#tile-hatch-above);
        opacity: 0.28;
      }

      .tile-room-hatch-below {
        fill: url(#tile-hatch-below);
        opacity: 0.22;
      }

      .tile-room-inset {
        fill: none;
        stroke-width: 0.95;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 2.6 4.2;
        pointer-events: none;
      }

      .tile-room-ghost {
        fill: none;
        stroke: rgba(244, 244, 244, 0.16);
        stroke-width: 0.72;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 7 12;
        pointer-events: none;
      }

      .tile-room-contour {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
        vector-effect: non-scaling-stroke;
      }

      .tile-room-contour-focus-main {
        stroke: rgba(244, 247, 250, 0.98);
        stroke-width: 2;
      }

      .tile-room-contour-focus-echo {
        stroke: rgba(244, 247, 250, 0.58);
        stroke-width: 0.95;
      }

      .tile-room-contour-focus-break {
        stroke: rgba(244, 247, 250, 0.74);
        stroke-width: 1.12;
      }

      .tile-room-contour-focus-scratch {
        stroke: rgba(244, 247, 250, 0.82);
        stroke-width: 0.86;
      }

      .tile-room-contour-above-main {
        stroke: rgba(214, 219, 224, 0.78);
        stroke-width: 1.62;
      }

      .tile-room-contour-above-echo {
        stroke: rgba(214, 219, 224, 0.42);
        stroke-width: 0.82;
      }

      .tile-room-contour-above-break {
        stroke: rgba(214, 219, 224, 0.52);
        stroke-width: 0.95;
      }

      .tile-room-contour-above-scratch {
        stroke: rgba(214, 219, 224, 0.64);
        stroke-width: 0.74;
      }

      .tile-room-contour-below-main {
        stroke: rgba(178, 184, 190, 0.6);
        stroke-width: 1.4;
      }

      .tile-room-contour-below-echo {
        stroke: rgba(178, 184, 190, 0.32);
        stroke-width: 0.74;
      }

      .tile-room-contour-below-break {
        stroke: rgba(178, 184, 190, 0.42);
        stroke-width: 0.84;
      }

      .tile-room-contour-below-scratch {
        stroke: rgba(178, 184, 190, 0.52);
        stroke-width: 0.66;
      }

      .tile-room-inset-focus {
        stroke: rgba(244, 246, 248, 0.54);
      }

      .tile-room-inset-above {
        stroke: rgba(206, 210, 214, 0.4);
      }

      .tile-room-inset-below {
        stroke: rgba(164, 170, 176, 0.34);
      }

      .tile-corner-hint {
        fill: none;
        stroke-linecap: round;
        pointer-events: none;
      }

      .tile-corner-hint-solid {
        stroke: rgba(236, 236, 236, 0.88);
        stroke-width: 1.1;
      }

      .tile-corner-hint-broken {
        stroke: rgba(224, 224, 224, 0.7);
        stroke-width: 0.9;
        stroke-dasharray: 2.8 2.8;
      }

      .tile-corner-hint-fade {
        stroke: rgba(208, 208, 208, 0.46);
        stroke-width: 0.75;
        stroke-dasharray: 2.2 3.8;
      }

      .tile-room-title {
        fill: var(--line-primary);
        font-size: 22px;
        font-weight: 700;
        font-family: "Patrick Hand", "IM Fell English SC", Georgia, "Times New Roman", serif;
        letter-spacing: 0.2px;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }

      .tile-room-level {
        fill: rgba(226, 226, 226, 0.85);
        font-size: 18px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }

      .tile-room-level-inline {
        fill: rgba(220, 224, 228, 0.9);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.15px;
        text-anchor: start;
        dominant-baseline: central;
        pointer-events: none;
      }

      .tile-room-id-inline {
        fill: rgba(232, 236, 240, 0.92);
        font-size: 19px;
        font-weight: 700;
        text-anchor: end;
        dominant-baseline: central;
        pointer-events: none;
      }

      .tile-grid-coord {
        fill: rgba(226, 226, 226, 0.64);
        font-size: 22px;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .dir-line {
        stroke-width: 2.2;
        fill: none;
        marker-end: url(#arrow-grid);
      }

      .dir-label {
        fill: var(--line-primary);
        font-size: 28px;
        font-weight: 700;
        font-family: "IM Fell English SC", Georgia, "Times New Roman", serif;
        letter-spacing: 0.4px;
        text-anchor: middle;
      }

      .floor-select {
        background: #141414;
        color: var(--ink);
        border: 1px solid var(--panel-line);
        padding: 4px 8px;
        border-radius: 6px;
      }

      .room-node-title {
        fill: #f2ead1;
        font-size: 20px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }

      .edge-compare {
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        opacity: 0.95;
        stroke: #f4f2ea;
      }

      .edge-match {
        stroke: #f4f2ea;
      }

      .edge-engine-only {
        stroke: #f4f2ea;
      }

      .edge-presentation-only {
        stroke: #f4f2ea;
      }

      .edge-puzzle {
        stroke-dasharray: 6 16;
        stroke-linecap: butt;
      }

      .edge-one-way-bar {
        stroke: #f4f2ea;
        stroke-width: 6;
        stroke-linecap: butt;
        opacity: 0.98;
      }

      .edge-depth-focus {
        stroke-width: 2.8;
        opacity: 0.98;
      }

      .edge-depth-near {
        stroke-width: 2.2;
        opacity: 0.78;
      }

      .edge-depth-far {
        stroke-width: 1.3;
        opacity: 0.48;
      }

      .player-marker {
        pointer-events: none;
        filter: drop-shadow(0 0 8px rgba(210, 20, 20, 0.72));
      }

      .legend-action {
        cursor: pointer;
      }

      .legend-action-hit {
        fill: rgba(72, 18, 18, 0.18);
        stroke: rgba(255, 80, 80, 0.42);
        stroke-width: 1.2;
      }

      .legend-action:hover .legend-action-hit,
      .legend-action:focus .legend-action-hit {
        fill: rgba(92, 24, 24, 0.52);
        stroke: rgba(255, 92, 92, 0.88);
      }

      .legend-action-target {
        fill: none;
        stroke: rgba(255, 92, 92, 0.92);
        stroke-width: 2.4;
        pointer-events: none;
      }

      .player-marker-ping {
        fill: none;
        stroke: rgba(255, 54, 54, 0.82);
        stroke-width: 5;
        pointer-events: none;
        transform-box: fill-box;
        transform-origin: center;
        animation: player-marker-ping-grow 1.15s cubic-bezier(0.12, 0, 0.16, 1) forwards,
          player-marker-ping-fade 1.15s ease-in forwards;
      }

      @keyframes player-marker-ping-grow {
        0% {
          transform: scale(0.5);
        }
        100% {
          transform: scale(1.34);
        }
      }

      @keyframes player-marker-ping-fade {
        0% {
          opacity: 1;
        }
        62% {
          opacity: 0.86;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>The Lurking Horror - Map Prototype v2 (Building/Isometric)</h1>
      <p>Campus-first layout pass with room-layer overlay: each room has building, layer, and tile metadata and can be filtered per floor.</p>
      <div class="controls">
        <label><input id="toggle-roads" type="checkbox" checked /> Show roads</label>
        <label><input id="toggle-legend" type="checkbox" checked /> Show legend</label>
        <label><input id="toggle-grid" type="checkbox" /> Show tile grid</label>
        <label><input id="toggle-floor-tiles" type="checkbox" checked /> Show floor tiles</label>
        <label><input id="toggle-weather" type="checkbox" checked /> Show weather</label>
        <label>
          Snow
          <input id="snow-density" type="range" min="1" max="10" step="0.25" value="1" />
          <span id="snow-density-value">x1.00</span>
        </label>
        <label>
          Floor layer
          <select id="floor-filter" class="floor-select">
            <option value="all">All</option>
            <option value="L+4">L+4</option>
            <option value="L+3">L+3</option>
            <option value="L+2">L+2</option>
            <option value="L+1">L+1</option>
            <option value="L0" selected>L0</option>
            <option value="L-1">L-1</option>
            <option value="L-2">L-2</option>
            <option value="L-3">L-3</option>
            <option value="L-4">L-4</option>
            <option value="L-5">L-5</option>
            <option value="L-6">L-6</option>
          </select>
        </label>
      </div>
      <div class="frame">
        <svg id="map" viewBox="0 0 1600 980" preserveAspectRatio="xMinYMin meet" aria-label="Integrated map prototype"></svg>
        <canvas id="map-snow" class="snow-overlay" aria-hidden="true"></canvas>
      </div>
    </div>

    <script src="./map-data.js"></script>
    <script src="./map-snow-layer.js"></script>
    <script src="./map-renderer.js"></script>
    <script>
      window.LhMapRenderer.create({
        mode: "prototype",
        svg: document.getElementById("map"),
        snowCanvas: document.getElementById("map-snow"),
        data: window.LhMapData,
        mapSnowLayer: window.MapSnowLayer
      });
    </script>
  </body>
</html>
