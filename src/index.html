<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Lurking Horror - Web Interpreter</title>
    <link rel="stylesheet" href="./modern.css" />
    <link rel="stylesheet" href="./map-renderer.css" />
  </head>
  <body>
    <main id="shell" class="shell" aria-label="Interactive fiction terminal">
      <canvas id="ambient-snow" class="ambient-snow-layer" aria-hidden="true"></canvas>
      <div id="ui-snow-mask" class="ui-snow-mask" aria-hidden="true">
        <span data-mask-target=".side-actions"></span>
        <span data-mask-target=".terminal-stack"></span>
        <span data-mask-target=".inline-map-panel"></span>
        <span data-mask-target=".command-sheet-panel"></span>
        <span data-mask-target=".save-load-sheet-panel"></span>
        <span data-mask-target=".map-sheet-panel"></span>
        <span data-mask-target=".credits-sheet-panel"></span>
        <span data-mask-target=".settings-sheet-panel"></span>
        <span data-mask-target=".confirm-sheet-panel"></span>
      </div>
      <div id="splash-slot"></div>
      <div id="shell-frame-slot"></div>
      <div id="command-sheet-slot"></div>
      <div id="save-load-sheet-slot"></div>
      <div id="map-sheet-slot"></div>
      <div id="credits-sheet-slot"></div>
      <div id="settings-sheet-slot"></div>
      <div id="confirm-sheet-slot"></div>
    </main>
    <script src="./partials/splash.js"></script>
    <script src="./partials/shell-frame.js"></script>
    <script src="./partials/command-sheet.js"></script>
    <script src="./partials/save-load-sheet.js"></script>
    <script src="./partials/map-sheet.js"></script>
    <script src="./partials/credits-sheet.js"></script>
    <script src="./partials/settings-sheet.js"></script>
    <script src="./partials/confirm-sheet.js"></script>
    <script src="./boot.js"></script>
  </body>
</html>
