<section id="confirm-sheet" class="confirm-sheet" aria-label="Action confirmation" hidden>
        <div class="confirm-sheet-panel">
          <div class="command-sheet-header">
            <h2 class="command-sheet-title">Confirm Action</h2>
          </div>
          <p id="confirm-message" class="settings-copy"></p>
          <div class="confirm-actions">
            <button id="confirm-cancel" class="btn" type="button">Cancel</button>
            <button id="confirm-continue" class="btn btn-accent" type="button">Continue</button>
          </div>
        </div>
      </section>
